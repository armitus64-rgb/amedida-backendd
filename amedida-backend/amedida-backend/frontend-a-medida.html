<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Medida — Trajes de dama y caballero</title>
<style>
:root{
  --bg:#FAF7F2; --bg-alt:#F1EAE0; --panel:#FFFFFF;
  --ink:#2A2622; --ink-soft:#6b6459;
  --forest:#1F3D2B; --forest-dark:#14261B;
  --rose:#C97B84; --rose-soft:#EBD3D5;
  --gold:#B8935F; --line:#DED1C1;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:sans-serif; padding:30px;}
h1{margin-bottom:6px;}
.filters{display:flex; gap:10px; margin:20px 0;}
.filter-btn{border:1px solid var(--line); background:#fff; padding:8px 16px; border-radius:999px; cursor:pointer;}
.filter-btn.active{background:var(--forest); color:#fff; border-color:var(--forest);}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px;}
.card h3{margin-bottom:4px;}
.price{color:var(--forest); font-weight:bold;}
.status{font-size:13px; color:var(--ink-soft); margin-bottom:16px;}
.auth-box{background:var(--bg-alt); padding:20px; border-radius:14px; max-width:360px; margin-bottom:24px;}
.auth-box input{display:block; width:100%; margin-bottom:10px; padding:10px; border:1px solid var(--line); border-radius:8px;}
.auth-box button{padding:10px 18px; border:none; background:var(--forest); color:#fff; border-radius:999px; cursor:pointer; margin-right:8px;}
</style>
</head>
<body>

<h1>A Medida</h1>
<p class="status" id="apiStatus">Conectando con la API Java en http://localhost:8080 ...</p>

<div class="auth-box">
  <h3>Ingresar / Registrarme</h3>
  <input type="text" id="regNombre" placeholder="Nombre (solo para registro)">
  <input type="email" id="authEmail" placeholder="Correo">
  <input type="password" id="authPass" placeholder="Contraseña">
  <button onclick="login()">Iniciar sesión</button>
  <button onclick="registrar()">Crear cuenta</button>
  <p id="authMsg" style="margin-top:10px; font-size:13px;"></p>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-cat="todos">Todos</button>
  <button class="filter-btn" data-cat="dama">Dama</button>
  <button class="filter-btn" data-cat="caballero">Caballero</button>
</div>

<div class="grid" id="grid"></div>

<script>
/* ============================================================
   URL BASE DE TU BACKEND JAVA
   Si corres el proyecto Spring Boot localmente, esto ya funciona.
   Si lo subes a un servidor, cambia esta línea por esa dirección.
   ============================================================ */
const API_BASE = 'http://localhost:8080/api';

let currentUser = null;

/* ---------------- CARGAR TRAJES DESDE JAVA ---------------- */
async function cargarTrajes(categoria = 'todos'){
  const url = categoria === 'todos'
    ? `${API_BASE}/trajes`
    : `${API_BASE}/trajes?categoria=${categoria}`;

  try{
    const respuesta = await fetch(url);
    if(!respuesta.ok) throw new Error('El servidor respondió con error ' + respuesta.status);
    const trajes = await respuesta.json();
    document.getElementById('apiStatus').textContent = `Conectado — ${trajes.length} trajes cargados desde Java.`;
    renderGrid(trajes);
  } catch(error){
    document.getElementById('apiStatus').textContent =
      '⚠ No se pudo conectar con el backend Java. ¿Ya ejecutaste "mvn spring-boot:run"? Detalle: ' + error.message;
  }
}

function renderGrid(trajes){
  const grid = document.getElementById('grid');
  grid.innerHTML = trajes.map(t => `
    <div class="card">
      <h3>${t.nombre}</h3>
      <p style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">${t.descripcion}</p>
      <p class="price">$ ${t.precioBase.toLocaleString('es-CO')}</p>
      <p style="font-size:11px; text-transform:uppercase; color:var(--gold); margin-top:6px;">${t.categoria}</p>
    </div>
  `).join('');
}

document.getElementById('filters').addEventListener('click', (e)=>{
  if(e.target.classList.contains('filter-btn')){
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    cargarTrajes(e.target.dataset.cat);
  }
});

/* ---------------- LOGIN / REGISTRO CONTRA LA API JAVA ---------------- */
async function login(){
  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPass').value;
  try{
    const respuesta = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if(!respuesta.ok) throw new Error('Correo o contraseña incorrectos');
    currentUser = await respuesta.json();
    document.getElementById('authMsg').textContent = 'Bienvenido, ' + currentUser.nombre;
  } catch(error){
    document.getElementById('authMsg').textContent = '⚠ ' + error.message;
  }
}

async function registrar(){
  const nombre = document.getElementById('regNombre').value;
  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPass').value;
  try{
    const respuesta = await fetch(`${API_BASE}/auth/registro`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, email, password })
    });
    if(!respuesta.ok) throw new Error('No se pudo crear la cuenta (¿correo repetido?)');
    currentUser = await respuesta.json();
    document.getElementById('authMsg').textContent = 'Cuenta creada. Bienvenido, ' + currentUser.nombre;
  } catch(error){
    document.getElementById('authMsg').textContent = '⚠ ' + error.message;
  }
}

/* ---------------- INICIO ---------------- */
cargarTrajes();
</script>
</body>
</html>
